# Publish to npm — no tokens, no 2FA prompt. TWO CHANNELS:
#
#   npm i -g nebula-notebook          → last NIGHTLY green main  (`latest`)
#   npm i -g nebula-notebook@stable   → last formal release      (fallback)
#
# WHY NIGHTLY IS THE DEFAULT. Almost every commit here is a fix, so the newest
# green build is usually the best one to be running — holding people back on a
# month-old tarball serves them older bugs. `latest` therefore tracks the
# nightly, and `@stable` is the fallback for anyone who wants to hold still
# on a version a human deliberately cut and used.
#
# Publishing per-commit was the wrong end of this: a busy day would mint
# dozens of permanent versions (npm forbids unpublishing after 72h) for
# changes nobody had run yet. Once a night, from whatever main is green,
# matches how the fixes are actually used. `npm publish` runs the package's own prepack, so
# each tarball is built from that exact commit.
#
# Publishing a release is one command with zero authentication:
#   gh release create v0.12.0 --generate-notes
#
# Auth is npm Trusted Publishing (OIDC): npm verifies this workflow's identity
# against the trusted publisher configured on the package page, so nothing is
# stored as a repository secret and nobody authenticates per publish.
#
# ONE-TIME SETUP (browser, once ever):
#   npmjs.com → package `nebula-notebook` → Settings → Trusted Publisher → GitHub Actions
#   Organization: jzhoulab  Repository: nebula-notebook  Workflow: publish.yml
#
# ROLLBACK, if a bad release escapes: cut a new release from the good commit.
# (Repointing with `npm dist-tag add` also works but needs a real token —
# trusted publishing only authorizes `npm publish`.) npm forbids unpublishing
# after 72h regardless, so rolling forward is the reliable path.
name: Publish

on:
  schedule: # → @next, nightly at 03:00 America/Chicago (08:00 UTC)
    - cron: "30 8 * * *"
  release: # → latest, the human "I have used this" gate
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish as latest (blank = nightly @next)"
        required: false

permissions:
  contents: write # commit the version bump back to main
  id-token: write # OIDC token for trusted publishing + provenance

concurrency: # a burst of pushes publishes once, from the newest commit
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older.
      - run: npm install -g npm@latest

      # Nothing new since the last nightly? Then there is nothing to publish —
      # quiet days should not mint versions. npm records the commit each
      # tarball was built from, which makes this exact rather than date math.
      - name: Skip if main has not moved
        if: github.event_name == 'schedule'
        run: |
          PUBLISHED=$(npm view nebula-notebook@latest gitHead 2>/dev/null || echo "")
          if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" = "$GITHUB_SHA" ]; then
            echo "main is unchanged since the last nightly ($PUBLISHED) — nothing to publish."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.SKIP != '1'
        run: npm ci || npm install

      # Gate: the nightly ships only if main is green. This is the whole
      # safety story for @next, so it runs BEFORE the version is chosen.
      - name: Test
        if: env.SKIP != '1'
        run: npm run test:run --if-present

      - name: Choose the version and channel
        if: env.SKIP != '1'
        run: |
          EXPLICIT="${{ github.event.release.tag_name || inputs.version }}"
          if [ -n "$EXPLICIT" ]; then
            # A formal release names its version and lands on @stable — the
            # deliberate, "I have used this" fallback channel.
            npm version "${EXPLICIT#v}" --no-git-tag-version --allow-same-version
            echo "NPM_TAG=stable" >> "$GITHUB_ENV"
            echo "COMMIT_BUMP=1" >> "$GITHUB_ENV"
          else
            # Nightly → a normal patch version on `latest`, so a plain
            # install gets the newest green build. Not a prerelease: those are
            # skipped by default resolution, which is the opposite of what we
            # want now that nightly IS the default.
            BASE=$(node -p "require('./package.json').version.split('-')[0]")
            npm version patch --no-git-tag-version
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
            echo "COMMIT_BUMP=1" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Publish
        if: env.SKIP != '1'
        run: npm publish --provenance --access public --tag "$NPM_TAG"

      - name: Commit the release bump
        if: env.SKIP != '1' && env.COMMIT_BUMP == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
