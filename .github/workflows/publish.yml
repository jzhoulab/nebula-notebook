# Publish to npm — no tokens, no 2FA prompt. TWO CHANNELS:
#
#   npm i -g nebula-notebook         → last release   (`latest`)
#   npm i -g nebula-notebook@next    → newest green main
#
# WHY BOTH. Almost every commit here is a fix, so users must not be stuck on a
# month-old tarball — that is what `@next` solves, automatically, with no
# release step. But `latest` is not auto-advanced from CI either, because the
# test suite demonstrably does not catch what live use catches: the tile-font,
# claim-dedupe and scrollbar bugs all passed CI green and were found by
# hand. A human saying "I have used this" is the only gate that has actually
# worked here, and a GitHub Release is that statement. `npm publish` runs the
# package's own prepack, so every tarball is built from that exact commit.
#
# Publishing a release is one command with zero authentication:
#   gh release create v0.12.0 --generate-notes
#
# Auth is npm Trusted Publishing (OIDC): npm verifies this workflow's identity
# against the trusted publisher configured on the package page, so nothing is
# stored as a repository secret and nobody authenticates per publish.
#
# ONE-TIME SETUP (browser, once ever):
#   npmjs.com → package `nebula-notebook` → Settings → Trusted Publisher → GitHub Actions
#   Organization: jzhoulab  Repository: nebula-notebook  Workflow: publish.yml
#
# ROLLBACK, if a bad release escapes: cut a new release from the good commit.
# (Repointing with `npm dist-tag add` also works but needs a real token —
# trusted publishing only authorizes `npm publish`.) npm forbids unpublishing
# after 72h regardless, so rolling forward is the reliable path.
name: Publish

on:
  push: # → @next, so the newest fixes are always one command away
    branches: [main]
    paths-ignore: # docs-only commits don't earn a version
      - "**/*.md"
      - "docs/**"
      - ".github/**"
  release: # → latest, the human "I have used this" gate
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish (blank = patch bump)"
        required: false

permissions:
  contents: write # commit the version bump back to main
  id-token: write # OIDC token for trusted publishing + provenance

concurrency: # a burst of pushes publishes once, from the newest commit
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The bot's own bump commit carries [skip ci], so this can't self-trigger.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older.
      - run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci || npm install

      # Gate: main publishes only if it is green. This is the whole safety
      # story for continuous publishing, so it runs BEFORE the version bump.
      - name: Test
        run: npm run test:run --if-present

      - name: Choose the version and channel
        run: |
          EXPLICIT="${{ github.event.release.tag_name || inputs.version }}"
          if [ -n "$EXPLICIT" ]; then
            # A release names its version and becomes what users get by default.
            npm version "${EXPLICIT#v}" --no-git-tag-version --allow-same-version
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
            echo "COMMIT_BUMP=1" >> "$GITHUB_ENV"
          else
            # main → a prerelease under @next. Prereleases are never installed
            # by default, so this cannot surprise anyone on `npm i -g nebula-notebook`,
            # and package.json on main stays a clean release number.
            BASE=$(node -p "require('./package.json').version.split('-')[0]")
            npm version "${BASE}-next.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
            echo "COMMIT_BUMP=0" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Publish
        run: npm publish --provenance --access public --tag "$NPM_TAG"

      - name: Commit the release bump
        if: env.COMMIT_BUMP == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
