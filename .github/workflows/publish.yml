# Publish to npm on every green commit to main — no tokens, no 2FA prompt.
#
# WHY CONTINUOUS, NOT PER-RELEASE: almost every commit here is a bug fix, so a
# "stable release" is mostly just older bugs. Holding npm back from main
# protected nobody — it only guaranteed that `npm i -g nebula-notebook` installed known
# broken code. npm now tracks main, gated on the test suite.
#
# Auth is npm Trusted Publishing (OIDC): npm verifies this workflow's identity
# against the trusted publisher configured on the package page, so nothing is
# stored as a repository secret and nobody authenticates per publish.
#
# ONE-TIME SETUP (browser, once ever):
#   npmjs.com → package `nebula-notebook` → Settings → Trusted Publisher → GitHub Actions
#   Organization/user: jzhoulab  Repository: nebula-notebook  Workflow: publish.yml
#
# ROLLBACK, if a bad version escapes: repoint the tag, don't unpublish —
#   npm dist-tag add nebula-notebook@0.3.1 latest
# Installs follow `latest` immediately; the bad version stays resolvable for
# anyone who pinned it, and npm forbids unpublishing after 72h anyway.
#
# A GitHub Release still works for deliberate minor/major bumps: the tag's
# version is published verbatim instead of a patch bump.
name: Publish

on:
  push:
    branches: [main]
    paths-ignore: # docs-only commits don't earn a version
      - "**/*.md"
      - "docs/**"
      - ".github/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish (blank = patch bump)"
        required: false

permissions:
  contents: write # commit the version bump back to main
  id-token: write # OIDC token for trusted publishing + provenance

concurrency: # a burst of pushes publishes once, from the newest commit
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The bot's own bump commit carries [skip ci], so this can't self-trigger.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older.
      - run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci || npm install

      # Gate: main publishes only if it is green. This is the whole safety
      # story for continuous publishing, so it runs BEFORE the version bump.
      - name: Test
        run: npm run test:run --if-present

      - name: Choose the version
        run: |
          EXPLICIT="${{ github.event.release.tag_name || inputs.version }}"
          if [ -n "$EXPLICIT" ]; then
            npm version "${EXPLICIT#v}" --no-git-tag-version --allow-same-version
          else
            npm version patch --no-git-tag-version
          fi
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Publish
        run: npm publish --provenance --access public

      - name: Commit the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json 2>/dev/null || git add package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
